<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찐리뷰 노트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
:root{
  --ground:#F2F4F1; --surface:#FFFFFF; --sunk:#E8ECE8; --ink:#17252A; --muted:#5A686C; --line:#D3DAD6;
  --accent:#2944C4; --accent-ink:#FFFFFF; --accent-soft:#E3E8FB;
  --real:#1D7F52; --real-soft:#DDF1E6; --maybe:#A86A12; --maybe-soft:#F8ECD6; --sus:#B83B12; --sus-soft:#FAE3DA;
  --focus:#2944C4; --shadow:0 1px 2px rgba(23,37,42,.06),0 4px 14px rgba(23,37,42,.06);
  --f-ui:"IBM Plex Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-read:"Gowun Batang","AppleMyungjo","Nanum Myeongjo",serif;
  --f-num:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#101517; --surface:#182023; --sunk:#1F292C; --ink:#E4ECE9; --muted:#9AAAA6; --line:#2C3A3D;
    --accent:#8FA3FF; --accent-ink:#0E1430; --accent-soft:#232D55;
    --real:#5CCB95; --real-soft:#173427; --maybe:#E0A94A; --maybe-soft:#3A2D14; --sus:#F08A62; --sus-soft:#3D2016;
    --focus:#8FA3FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#101517; --surface:#182023; --sunk:#1F292C; --ink:#E4ECE9; --muted:#9AAAA6; --line:#2C3A3D;
  --accent:#8FA3FF; --accent-ink:#0E1430; --accent-soft:#232D55;
  --real:#5CCB95; --real-soft:#173427; --maybe:#E0A94A; --maybe-soft:#3A2D14; --sus:#F08A62; --sus-soft:#3D2016;
  --focus:#8FA3FF; --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.55;word-break:keep-all;padding-inline:16px;padding-block:0 104px;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}
.wrap{max-width:760px;margin:0 auto}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:13px}
.eyebrow{font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:10px}
.brand h1{font-size:19px;font-weight:700;letter-spacing:-.01em}
.brand h1 b{color:var(--accent)}
.store-pill{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.store-pill.ok{background:var(--real-soft);color:var(--real)}
.store-pill.local{background:var(--maybe-soft);color:var(--maybe)}

/* nav */
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:4px;margin-block:4px 16px}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:9px 6px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;font-size:14px}
.tab small{font-weight:500;font-size:11px}
.tab[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
@media (max-width:759px){
  .tabs{position:fixed;left:0;right:0;bottom:0;margin:0;border-radius:0;border-width:1px 0 0;padding:6px 10px calc(6px + env(safe-area-inset-bottom,0px));z-index:20;box-shadow:0 -4px 16px rgba(0,0,0,.06)}
}

/* generic surfaces */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1 1 180px;min-width:0}
.stack{display:flex;flex-direction:column;gap:14px}
label.field{display:flex;flex-direction:column;gap:5px;font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=url],input[type=number],select,textarea{background:var(--ground);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ink);width:100%;min-width:0}
textarea{resize:vertical;line-height:1.6}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--sus);border-color:var(--sus)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.wide{width:100%}
.note{font-size:13px;color:var(--muted);background:var(--sunk);border-radius:10px;padding:10px 12px}
.note.warn{background:var(--maybe-soft);color:var(--maybe)}
.note.bad{background:var(--sus-soft);color:var(--sus)}
.note.good{background:var(--real-soft);color:var(--real)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:12px;font-size:14px;z-index:40;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
@media (min-width:760px){.toast{bottom:24px}}

/* progress */
.progress{display:flex;flex-direction:column;gap:6px}
.progress .bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.progress .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.progress .meta{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}

/* review slip */
.slip{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.slip-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.slip-prod{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.slip-sub{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap}
.stars{font-size:15px;letter-spacing:1px;color:var(--maybe);white-space:nowrap}
.stars .off{color:var(--line)}
.nostar{font-size:13px;color:var(--muted);white-space:nowrap}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:12px;padding:2px 8px;border-radius:6px;background:var(--sunk);color:var(--muted);font-weight:500}
.badge.trial{background:var(--sus-soft);color:var(--sus)}
.badge.redo{background:var(--accent-soft);color:var(--accent)}
.badge.demo{background:var(--maybe-soft);color:var(--maybe)}
.slip-text{font-family:var(--f-read);font-size:17px;line-height:1.8;white-space:pre-wrap;overflow-wrap:anywhere;max-height:52vh;overflow:auto}
.slip-foot{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);gap:8px;flex-wrap:wrap}

/* judging controls */
.judge{display:flex;flex-direction:column;gap:14px}
.axis{display:flex;flex-direction:column;gap:7px}
.axis-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.axis-head h3{font-size:14px;font-weight:600}
.axis-head .hint{font-size:12px;color:var(--muted)}
.seg{display:grid;gap:6px}
.seg.c4{grid-template-columns:repeat(4,1fr)}
.seg.c3{grid-template-columns:repeat(3,1fr)}
.seg.c5{grid-template-columns:repeat(5,1fr)}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;min-height:48px;padding:6px 4px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1.2}
.seg button small{font-weight:500;font-size:11px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg button[aria-pressed="true"] small{color:inherit;opacity:.85}
.seg.compact button{min-height:40px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;min-height:36px}
.chip.ev[aria-pressed="true"]{background:var(--real-soft);border-color:var(--real);color:var(--real)}
.chip.pr[aria-pressed="true"]{background:var(--sus-soft);border-color:var(--sus);color:var(--sus)}
.chip-group{display:flex;flex-direction:column;gap:6px}
.chip-group .eyebrow{font-size:11px}
.tag{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13px;padding:4px 10px;border-radius:999px;background:var(--sunk);color:var(--muted)}
.tag.real{background:var(--real-soft);color:var(--real)}
.tag.maybe{background:var(--maybe-soft);color:var(--maybe)}
.tag.sus{background:var(--sus-soft);color:var(--sus)}
.actions{position:sticky;bottom:calc(72px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--ground) 70%,transparent);padding-block:10px 4px;display:flex;flex-direction:column;gap:8px;z-index:5}
@media (min-width:760px){.actions{bottom:0}}
.save-row{display:flex;gap:8px;align-items:stretch}
.save-row .btn{min-height:52px;padding-inline:12px}
.save-row .btn.primary{flex:1;font-size:16px}
.kbd{font-family:var(--f-num);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.keys{font-size:12px;color:var(--muted);display:none;gap:10px;flex-wrap:wrap}
@media (min-width:760px) and (hover:hover){.keys{display:flex}}
details.more{border-top:1px dashed var(--line);padding-top:10px}
details.more summary{cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
details.more[open] summary{margin-bottom:10px}

/* collect */
.prod-list{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.prod{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 12px;border-top:1px solid var(--line);background:var(--surface);flex-wrap:wrap}
.prod:first-child{border-top:0}
.prod .name{font-weight:600;overflow-wrap:anywhere}
.prod .counts{font-size:12px;color:var(--muted)}
.prod.sel{background:var(--accent-soft)}
.preview{display:flex;flex-direction:column;gap:10px}
.pv{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.pv.dup{opacity:.55}
.pv-top{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pv-top select{width:auto;padding:6px 8px}
.pv-top input[type=text]{width:auto;flex:1 1 120px;padding:6px 8px}
.pv textarea{font-family:var(--f-read);font-size:15px;min-height:72px}
.toggle{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 9px;font-size:12px;font-weight:500}
.toggle[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.progress .bar i{transition:none}}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile .v{font-family:var(--f-num);font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted)}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.t th:first-child,table.t td:first-child{text-align:left}
table.t th{font-weight:600;color:var(--muted);font-size:12px}
table.t td.cell{font-family:var(--f-num)}
.heat{border-radius:6px;display:inline-block;min-width:34px;padding:2px 6px;text-align:center}
.stack-bar{display:flex;height:10px;border-radius:99px;overflow:hidden;background:var(--sunk);min-width:120px}
.stack-bar i{display:block;height:100%}
.hbar{display:grid;grid-template-columns:minmax(90px,150px) 1fr auto;gap:8px;align-items:center;font-size:13px}
.hbar .track{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:99px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;background:var(--c)}
.empty{text-align:center;padding:28px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.empty h2{font-size:17px}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><h1>찐리뷰 <b>노트</b></h1><span class="muted small">리뷰 수집과 판정</span></div>
    <span id="storePill" class="store-pill">불러오는 중</span>
  </header>

  <nav class="tabs" role="tablist" aria-label="화면">
    <button class="tab" role="tab" id="tab-judge" aria-controls="view-judge" aria-selected="true" data-view="judge">판정<small id="navPool">풀 0</small></button>
    <button class="tab" role="tab" id="tab-collect" aria-controls="view-collect" aria-selected="false" data-view="collect">수집<small>붙여넣기</small></button>
    <button class="tab" role="tab" id="tab-stats" aria-controls="view-stats" aria-selected="false" data-view="stats">현황<small id="navDone">0개</small></button>
    <button class="tab" role="tab" id="tab-settings" aria-controls="view-settings" aria-selected="false" data-view="settings">설정<small>내보내기</small></button>
  </nav>

  <main>
    <section id="view-judge" role="tabpanel" aria-labelledby="tab-judge"></section>
    <section id="view-collect" role="tabpanel" aria-labelledby="tab-collect" hidden></section>
    <section id="view-stats" role="tabpanel" aria-labelledby="tab-stats" hidden></section>
    <section id="view-settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
  </main>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

<script>
(() => {
"use strict";

/* ---------- 기본 도구 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = (p) => p + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const nowISO = () => new Date().toISOString();
const pick = (arr) => arr[Math.floor(Math.random() * arr.length)];
const clone = (o) => JSON.parse(JSON.stringify(o));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

let toastTimer = 0;
function toast(msg, ms = 2600) {
  const el = $("#toast");
  el.textContent = msg;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, ms);
}

/* ---------- 라벨 체계 ---------- */
const PLATFORMS = ["스마트스토어", "쿠팡", "기타"];
const BADGES = ["체험단", "한달사용", "재구매", "포토"];
const EVIDENCE = [
  { v: 0, t: "없음", s: "경험 없음" },
  { v: 1, t: "약함", s: "일반적 언급" },
  { v: 2, t: "구체적", s: "상황·기간" },
  { v: 3, t: "매우 구체적", s: "경험 서술" },
];
const PROMO = [
  { v: 0, t: "없음", s: "자연스러움" },
  { v: 1, t: "약함", s: "조금 걸림" },
  { v: 2, t: "강함", s: "홍보 같음" },
];
const DEFAULT_SETTINGS = {
  weeklyGoal: 30,
  rejudgeRatio: 0.1,
  rejudgeMinDays: 14,
  holdoutRatio: 0.2,
  evidenceChips: ["사용 기간", "사용 상황", "예상과 다른 경험", "작은 단점", "개인 맥락", "비교 경험", "재구매·반복 사용"],
  promoChips: ["홍보성 표현", "과도한 찬양", "상품 설명과 비슷함", "대가 표시(체험단 등)", "내용 없음"],
};
const TAGS = ["찐", "애매", "의심"];
const TAG_CLASS = { "찐": "real", "애매": "maybe", "의심": "sus" };
const TAG_COLOR = { "찐": "var(--real)", "애매": "var(--maybe)", "의심": "var(--sus)" };

/* 두 축에서 기존 3단계 태그를 계산한다. */
function deriveTag(ev, pr) {
  if (pr === 2 || (pr === 1 && ev <= 1)) return "의심";
  if (ev >= 2 && pr === 0) return "찐";
  return "애매";
}
const LEN_BUCKETS = ["짧음", "보통", "긺"];
function lenBucket(n) { return n < 40 ? "짧음" : n <= 150 ? "보통" : "긺"; }
function textLen(t) { return String(t || "").replace(/\s+/g, "").length; }
function normText(t) { return String(t || "").replace(/[\s\p{P}\p{S}]/gu, "").slice(0, 120); }
function weekStart(d = new Date()) {
  const x = new Date(d);
  x.setHours(0, 0, 0, 0);
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7));
  return x;
}
function fmtDate(iso) {
  if (!iso) return "";
  const d = new Date(iso);
  if (isNaN(d)) return "";
  return `${d.getMonth() + 1}/${d.getDate()} ${String(d.getHours()).padStart(2, "0")}:${String(d.getMinutes()).padStart(2, "0")}`;
}
function starsHTML(n) {
  if (!n) return `<span class="nostar">별점 없음</span>`;
  return `<span class="stars" aria-label="별점 ${n}점">${"★".repeat(n)}<span class="off">${"★".repeat(5 - n)}</span></span>`;
}

/* ---------- 저장소: Claude 저장소(db) 또는 이 기기(localStorage) ---------- */
const LS_KEY = "review-lab-v1";
const DOC_CAP = 5000;
const Store = {
  mode: "loading",
  db: null,
  ready: false,
  reviews: new Map(),
  products: new Map(),
  settings: clone(DEFAULT_SETTINGS),
  listeners: new Set(),
  onChange(fn) { this.listeners.add(fn); },
  emit() { for (const fn of this.listeners) { try { fn(); } catch (e) { console.error(e); } } },
};
const Caps = { sample: null, downloads: null };

async function capability(name) {
  try {
    const c = window.claude;
    if (!c || typeof c.use !== "function") return null;
    return await c.use(name);
  } catch { return null; }
}

function dbErrorText(e) {
  const code = e && e.code;
  if (code === "quota_exceeded") return "저장 공간이 가득 찼습니다. 설정에서 백업을 내려받은 뒤 오래된 리뷰를 지우세요.";
  if (code === "resource_exhausted") return "요청이 너무 많습니다. 잠시 뒤 다시 시도하세요.";
  if (code === "revoked" || code === "not_granted") return "저장소 권한이 없어 읽기 전용으로 표시합니다.";
  return "저장하지 못했습니다. 연결을 확인한 뒤 다시 시도하세요.";
}

async function withRetry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await sleep(300 + Math.random() * 500); return await fn(); }
    throw e;
  }
}

function initDb(db) {
  Store.mode = "db";
  Store.db = db;
  const got = { r: false, p: false, s: false };
  const settle = () => { if (got.r && got.p && got.s) Store.ready = true; Store.emit(); };
  const onErr = (e) => { toast(dbErrorText(e), 5000); };
  db.collection("reviews").onSnapshot((snap) => {
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, { ...d.data(), id: d.id });
    Store.reviews = m; got.r = true; settle();
  }, onErr);
  db.collection("products").onSnapshot((snap) => {
    const m = new Map();
    for (const d of snap.docs) m.set(d.id, { ...d.data(), id: d.id });
    Store.products = m; got.p = true; settle();
  }, onErr);
  db.doc("meta/settings").onSnapshot((s) => {
    Store.settings = { ...clone(DEFAULT_SETTINGS), ...(s.exists ? clone(s.data()) : {}) };
    got.s = true; settle();
  }, onErr);
}

function initLocal() {
  Store.mode = "local";
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) {
      const o = JSON.parse(raw);
      for (const r of o.reviews || []) Store.reviews.set(r.id, r);
      for (const p of o.products || []) Store.products.set(p.id, p);
      Store.settings = { ...clone(DEFAULT_SETTINGS), ...(o.settings || {}) };
    }
    localStorage.setItem(LS_KEY + "-probe", "1");
    localStorage.removeItem(LS_KEY + "-probe");
  } catch { Store.mode = "memory"; }
  Store.ready = true;
  Store.emit();
}

function persistLocal() {
  if (Store.mode !== "local") return;
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      reviews: [...Store.reviews.values()],
      products: [...Store.products.values()],
      settings: Store.settings,
    }));
  } catch { toast("이 브라우저에 저장하지 못했습니다. 설정 화면에서 백업 파일을 받아 두세요.", 5000); }
}

/* 문서 전체를 쓴다. 화면은 먼저 바꾸고 저장소 반영은 뒤따른다. */
async function putDoc(coll, obj) {
  const body = clone(obj);
  Store[coll].set(obj.id, body);
  if (Store.mode === "db") {
    Store.emit();
    await withRetry(() => Store.db.collection(coll).doc(obj.id).set(body));
  } else { persistLocal(); Store.emit(); }
}
async function removeDoc(coll, id) {
  Store[coll].delete(id);
  if (Store.mode === "db") {
    Store.emit();
    await withRetry(() => Store.db.collection(coll).doc(id).delete());
  } else { persistLocal(); Store.emit(); }
}
async function putSettings(next) {
  Store.settings = clone(next);
  if (Store.mode === "db") {
    Store.emit();
    await withRetry(() => Store.db.doc("meta/settings").set(clone(next)));
  } else { persistLocal(); Store.emit(); }
}
/* 여러 문서를 몇 개씩 나눠 쓴다. */
async function putMany(coll, list, onProgress) {
  let done = 0;
  const queue = list.slice();
  const worker = async () => {
    while (queue.length) {
      const item = queue.shift();
      await putDoc(coll, item);
      done++;
      onProgress && onProgress(done, list.length);
    }
  };
  const n = Store.mode === "db" ? 3 : 1;
  await Promise.all(Array.from({ length: n }, worker));
}

/* ---------- 붙여넣은 텍스트를 개별 리뷰로 나누기 ---------- */
const PARSE_LIMIT = 24000;
const DATE_RE = /(20\d{2}|\d{2})\s*[.\-/]\s*(\d{1,2})\s*[.\-/]\s*(\d{1,2})\.?/;
const STAR_RE = /^(?:평점|별점)\s*[:：]?\s*([1-5])(?:\s*점)?$|^([1-5])\s*점$|^5점\s*만점에\s*([1-5])점/;
const NOISE_RE = /^(신고하기|신고|도움이 ?돼요|도움돼요|도움 ?안 ?돼요|도움이 ?안 ?돼요|답글|답글쓰기|더보기|접기|펼쳐보기|리뷰 더보기|판매자 답변|사진|이미지|동영상|좋아요|추천|비추천|\d+|\d+\s*\/\s*\d+)$/;

function normDate(s) {
  const m = String(s || "").match(/(20\d{2}|\d{2})\s*[.\-/년]\s*(\d{1,2})\s*[.\-/월]\s*(\d{1,2})/);
  if (!m) return "";
  const y = m[1].length === 2 ? "20" + m[1] : m[1];
  return `${y}-${m[2].padStart(2, "0")}-${m[3].padStart(2, "0")}`;
}
function isNick(l) { return /\*/.test(l) && l.length <= 20 && l.split(/\s+/).length <= 2; }
function isStarLine(l) { return STAR_RE.test(l) || /^[★☆]{1,5}$/.test(l); }
function isDateLine(l) { return l.length <= 40 && DATE_RE.test(l); }

function parseChunk(ls) {
  let star = null, date = "", option = "", helpful = null;
  const badges = new Set();
  const body = [];
  for (const raw of ls) {
    const l = raw.trim();
    if (!l) { if (body.length && body[body.length - 1] !== "") body.push(""); continue; }
    let m;
    if ((m = l.match(STAR_RE))) { star = +(m[1] || m[2] || m[3]); continue; }
    if (/^[★☆]{1,5}$/.test(l)) { star = (l.match(/★/g) || []).length || null; continue; }
    if (isDateLine(l)) { if (!date) date = normDate(l); continue; }
    if ((m = l.match(/(\d[\d,]*)\s*명(?:에게|이)?\s*도움/))) { helpful = +m[1].replace(/,/g, ""); continue; }
    if (/체험단|제공받아|무상으로 제공/.test(l)) {
      badges.add("체험단");
      if (l.length <= 20 || /제공받아|무상으로|이벤트로/.test(l)) continue;
    }
    if (/^한\s?달\s?사용/.test(l) && l.length <= 12) { badges.add("한달사용"); continue; }
    if (/^재구매/.test(l) && l.length <= 8) { badges.add("재구매"); continue; }
    if (/^포토/.test(l) && l.length <= 8) { badges.add("포토"); continue; }
    if (/^(옵션|선택|구매\s?옵션|상품\s?옵션|사이즈|색상|판매자)\s*[:：]/.test(l)) { option = option ? option + " / " + l : l; continue; }
    if (isNick(l) || NOISE_RE.test(l)) continue;
    body.push(l);
  }
  const text = body.join("\n").replace(/\n{3,}/g, "\n\n").trim();
  if (textLen(text) < 2) return null;
  return { star, date, option: option.slice(0, 200), badges: [...badges], helpful, text };
}

/* 규칙 기반: 날짜 줄을 리뷰 경계로 본다. 날짜가 없으면 빈 줄로 나눈다. */
function ruleParse(raw) {
  const lines = String(raw || "").replace(/\r/g, "").split("\n");
  const hasDates = lines.some((l) => isDateLine(l.trim()));
  let chunks = [];
  if (hasDates) {
    let cur = [];
    const hasBody = (arr) => arr.some((x) => {
      const t = x.trim();
      return t && !isDateLine(t) && !isStarLine(t) && !isNick(t) && !NOISE_RE.test(t);
    });
    for (const l of lines) {
      if (isDateLine(l.trim()) && hasBody(cur)) {
        const carry = [];
        while (cur.length) {
          const t = cur[cur.length - 1].trim();
          if (!t || isStarLine(t) || isNick(t)) carry.unshift(cur.pop()); else break;
        }
        chunks.push(cur);
        cur = carry;
      }
      cur.push(l);
    }
    chunks.push(cur);
  } else {
    chunks = String(raw || "").replace(/\r/g, "").split(/\n\s*\n+/).map((b) => b.split("\n"));
  }
  return chunks.map(parseChunk).filter(Boolean);
}

function normalizeParsed(o) {
  if (!o || typeof o !== "object") return null;
  const text = String(o.text || "").trim();
  if (textLen(text) < 2) return null;
  let star = Number.parseInt(o.star, 10);
  if (!(star >= 1 && star <= 5)) star = null;
  let date = String(o.date || "").trim();
  if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) date = normDate(date);
  const badges = Array.isArray(o.badges) ? [...new Set(o.badges.map(String).filter((b) => BADGES.includes(b)))] : [];
  let helpful = Number.parseInt(o.helpful, 10);
  if (!Number.isFinite(helpful) || helpful < 0) helpful = null;
  return { star, date, option: String(o.option || "").trim().slice(0, 200), badges, helpful, text };
}

async function aiParse(raw, platform, signal) {
  const text = String(raw).slice(0, PARSE_LIMIT);
  const prompt = [

    "JSON 배열 하나로만 답하라. 각 원소의 형식:",

    "규칙:",

    "- 판매자 답글, 메뉴, 버튼 문구, 광고, 상품 설명은 제외하라.",
    "- 체험단·무상 제공·대가 관련 안내 문구가 붙은 리뷰는 badges에 체험단을 넣고 그 안내 문구는 본문에서 뺀다.",
    "- 연도가 두 자리면 20을 붙인다. 알 수 없는 값은 null 또는 빈 문자열로 둔다.",
    "- 리뷰가 하나도 없으면 [] 로 답한다.",
    "",
    "<복사한 텍스트>",

  ].join("\n");
  const out = await Caps.sample.json(prompt, { modelTier: "quick", signal });
  if (!Array.isArray(out)) throw { code: "invalid_json", message: "배열이 아님" };
  return out.map(normalizeParsed).filter(Boolean);
}

/* ---------- 판정 화면 ---------- */
const J = { current: null, draft: null, skipped: new Set(), lastProductId: null, undo: null, delAsk: false };
function newDraft(prev) {
  return {
    evidence: prev ? prev.evidence : null,
    promo: prev ? prev.promo : null,
    confidence: prev ? prev.confidence ?? null : null,
    chips: prev ? (prev.chips || []).slice() : [],
    note: prev ? prev.note || "" : "",
    split: prev ? prev.split : undefined,
  };
}
const allReviews = () => [...Store.reviews.values()];
const poolCount = () => allReviews().filter((r) => !r.label).length;
function weekCount() {
  const ws = weekStart().getTime();
  let n = 0;
  for (const r of Store.reviews.values()) {
    if (r.label && Date.parse(r.label.at) >= ws) n++;
    if (r.rejudge && Date.parse(r.rejudge.at) >= ws) n++;
  }
  return n;
}
const strataKey = (r) => (r.star || 0) + "|" + lenBucket(r.len ?? textLen(r.text));

/* 다음 리뷰 고르기: 일정 확률로 오래된 판정을 가려서 다시 묻고,
   나머지는 별점×길이 칸 가운데 판정이 가장 적은 칸에서 고른다. */
function pickNext() {
  const s = Store.settings;
  const all = allReviews();
  const labeled = all.filter((r) => r.label);
  const minMs = (Number(s.rejudgeMinDays) || 14) * 86400000;
  const rejudge = labeled.filter((r) => !r.rejudge && Date.now() - Date.parse(r.label.at) >= minMs && !J.skipped.has(r.id));
  let pool = all.filter((r) => !r.label && !J.skipped.has(r.id));
  if (!pool.length && !rejudge.length && J.skipped.size) {
    J.skipped.clear();
    pool = all.filter((r) => !r.label);
  }
  if (rejudge.length && (!pool.length || Math.random() < (Number(s.rejudgeRatio) || 0))) {
    return { id: pick(rejudge).id, redo: true };
  }
  if (!pool.length) return null;
  const counts = new Map();
  for (const r of labeled) counts.set(strataKey(r), (counts.get(strataKey(r)) || 0) + 1);
  let best = Infinity, cands = [];
  for (const r of pool) {
    let c = counts.get(strataKey(r)) || 0;
    if (r.productId === J.lastProductId) c += 0.5;
    if (c < best) { best = c; cands = [r]; } else if (c === best) cands.push(r);
  }
  return { id: pick(cands).id, redo: false };
}

function ensureCurrent() {
  if (Store.reviews.size === 0) {
    if (!J.current || J.current.id !== "demo") { J.current = { id: "demo", redo: false }; J.draft = newDraft(); }
    return;
  }
  const r = J.current && Store.reviews.get(J.current.id);
  const valid = r && (J.current.redo ? r.label && !r.rejudge : !r.label);
  if (valid) return;
  J.current = pickNext();
  J.draft = newDraft();
  J.delAsk = false;
}

function nextRejudgeDate() {
  const minMs = (Number(Store.settings.rejudgeMinDays) || 14) * 86400000;
  let soonest = Infinity;
  for (const r of Store.reviews.values()) if (r.label && !r.rejudge) soonest = Math.min(soonest, Date.parse(r.label.at) + minMs);
  return isFinite(soonest) ? new Date(soonest) : null;
}

          <label class="field">한 줄 메모<input type="text" id="jNote" maxlength="200" placeholder="예: 사용 기간은 있는데 문장이 상세페이지와 비슷함" value="${esc(d.note)}"></label>

            ? `<div class="row"><span class="small" style="color:var(--sus)">이 리뷰를 풀에서 지웁니다.</span><button type="button" class="btn danger" data-act="delYes">지우기</button><button type="button" class="btn ghost" data-act="delNo">취소</button></div>`
            : `<button type="button" class="btn ghost" data-act="delAsk">리뷰가 아니거나 잘못 나뉜 항목이면 지우기</button>`}

    </div>
  </div>`;
  syncDraftUI();
}

function syncDraftUI() {
  const v = $("#view-judge");
  const d = J.draft;
  if (!d) return;
  v.querySelectorAll('[data-act="ev"]').forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === d.evidence)));
  v.querySelectorAll('[data-act="pr"]').forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === d.promo)));
  v.querySelectorAll('[data-act="cf"]').forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.v === d.confidence)));
  v.querySelectorAll('[data-act="chip"]').forEach((b) => b.setAttribute("aria-pressed", String(d.chips.includes(b.dataset.name))));
  const tagEl = $("#jTag");
  const save = $("#jSave");
  const ready = d.evidence != null && d.promo != null;
  if (tagEl) {
    if (ready) { const t = deriveTag(d.evidence, d.promo); tagEl.className = "tag " + TAG_CLASS[t]; tagEl.textContent = t; }
    else { tagEl.className = "tag"; tagEl.textContent = "두 축을 고르면 표시"; }
  }
  if (save) save.disabled = !ready;
}

async function saveJudgment() {
  const d = J.draft;
  if (!J.current || d.evidence == null || d.promo == null) return;
  const tag = deriveTag(d.evidence, d.promo);
  if (J.current.id === "demo") {
    toast(`예시라서 저장하지 않았습니다 · ${tag}`);
    J.draft = newDraft();
    renderJudge();
    return;
  }
  const cur = Store.reviews.get(J.current.id);
  if (!cur) return;
  const r = clone(cur);
  const redo = J.current.redo;
  const entry = { evidence: d.evidence, promo: d.promo, confidence: d.confidence, chips: d.chips.slice(), note: d.note.trim(), tag, at: nowISO() };
  if (redo) r.rejudge = entry;
  else { entry.split = d.split || (Math.random() < (Number(Store.settings.holdoutRatio) || 0) ? "eval" : "train"); r.label = entry; }
  J.undo = { before: clone(cur), entry, redo };
  J.lastProductId = r.productId;
  J.current = null;
  J.draft = newDraft();
  try {
    await putDoc("reviews", r);
    toast(redo ? "재판정을 저장했습니다" : `저장했습니다 · ${tag}`, 1400);
  } catch (e) { toast(dbErrorText(e), 5000); }
}

async function undoLast() {
  if (!J.undo) return;
  const { before, entry, redo } = J.undo;
  J.undo = null;
  J.current = { id: before.id, redo };
  J.draft = newDraft(entry);
  try { await putDoc("reviews", before); toast("되돌렸습니다. 다시 고르세요.", 1600); }
  catch (e) { toast(dbErrorText(e), 5000); }
  renderJudge();
}

function skipCurrent() {
  if (!J.current) return;
  if (J.current.id !== "demo") J.skipped.add(J.current.id);
  J.current = null;
  J.draft = newDraft();
  renderJudge();
  if (Store.reviews.size) toast("건너뛰었습니다. 나중에 다시 나옵니다.", 1400);
}

$("#view-judge").addEventListener("click", (e) => {
  const b = e.target.closest("[data-act]");
  if (!b || !J.draft) return;
  const act = b.dataset.act;
  const d = J.draft;
  if (act === "ev") d.evidence = d.evidence === +b.dataset.v ? null : +b.dataset.v;
  else if (act === "pr") d.promo = d.promo === +b.dataset.v ? null : +b.dataset.v;
  else if (act === "cf") d.confidence = d.confidence === +b.dataset.v ? null : +b.dataset.v;
  else if (act === "chip") {
    const n = b.dataset.name;
    d.chips = d.chips.includes(n) ? d.chips.filter((x) => x !== n) : [...d.chips, n];
  }
  else if (act === "save") return void saveJudgment();
  else if (act === "skip") return skipCurrent();
  else if (act === "undo") return void undoLast();
  else if (act === "delAsk" || act === "delNo") { J.delAsk = act === "delAsk"; renderJudge(); if (J.delAsk) { const dt = $("#view-judge details.more"); if (dt) dt.open = true; } return; }
  else if (act === "delYes") {
    const id = J.current && J.current.id;
    J.delAsk = false; J.current = null; J.draft = newDraft();
    if (id && id !== "demo") removeDoc("reviews", id).then(() => toast("지웠습니다", 1400)).catch((err) => toast(dbErrorText(err), 5000));
    renderJudge();
    return;
  }
  syncDraftUI();
});
$("#view-judge").addEventListener("input", (e) => { if (e.target.id === "jNote" && J.draft) J.draft.note = e.target.value; });

document.addEventListener("keydown", (e) => {
  if ($("#view-judge").hidden || e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const tag = (e.target.tagName || "").toLowerCase();
  if (tag === "input" || tag === "textarea" || tag === "select") return;
  if (!J.draft) return;
  const c = e.code;
  const digit = /^(Digit|Numpad)([0-3])$/.exec(c);
  if (digit) { J.draft.evidence = +digit[2]; syncDraftUI(); e.preventDefault(); return; }
  const promoKey = { KeyQ: 0, KeyW: 1, KeyE: 2 }[c];
  if (promoKey !== undefined) { J.draft.promo = promoKey; syncDraftUI(); e.preventDefault(); return; }
  if (c === "Enter" || c === "NumpadEnter") {
    if (tag === "button") return;
    e.preventDefault(); saveJudgment(); return;
  }
  if (c === "KeyS") { e.preventDefault(); skipCurrent(); return; }
  if (c === "KeyZ") { e.preventDefault(); undoLast(); }
});

function productCounts() {
  const m = new Map();
  for (const r of Store.reviews.values()) {
    const c = m.get(r.productId) || { total: 0, done: 0 };
    c.total++; if (r.label) c.done++;
    m.set(r.productId, c);
  }
  return m;
}
function existingKeys() {
  const s = new Set();
  for (const r of Store.reviews.values()) s.add(r.productId + "|" + normText(r.text));
  return s;
}
function markDuplicates() {
  const keys = existingKeys();
  const seen = new Set();
  for (const it of C.items) {
    const k = (C.productId || "") + "|" + normText(it.text);
    it._dup = keys.has(k) || seen.has(k);
    seen.add(k);
  }
}

async function doParse() {
  const raw = $("#cRaw").value;
  C.raw = raw;
  if (!raw.trim()) { C.msg = "붙여넣은 텍스트가 없습니다."; C.msgKind = "warn"; renderCollect(); return; }
  const product = Store.products.get(C.productId);
  let items = null;
  let msg = "", kind = "";
  if (C.useAi && Caps.sample && !C.aiBlocked) {
    C.parsing = true; C.ctl = new AbortController(); C.msg = ""; renderCollect();
    try {
      items = await aiParse(raw, product ? product.platform : "쇼핑몰", C.ctl.signal);
      if (!items.length) { items = null; msg = "AI가 리뷰를 찾지 못해 규칙 기반으로 나눴습니다."; kind = "warn"; }
      else {
        msg = `AI로 ${items.length}개를 나눴습니다. 본문이 원문과 같은지 훑어보세요.`;
        if (raw.length > PARSE_LIMIT) { msg += " 텍스트가 길어 앞부분만 나눴습니다. 나머지는 따로 붙여넣으세요."; kind = "warn"; }
      }
    } catch (e) {
      C.parsing = false;
      if (e && e.code === "cancelled") { C.msg = "나누기를 멈췄습니다."; C.msgKind = ""; renderCollect(); return; }
      if (e && AI_OFF_CODES.includes(e.code)) C.aiBlocked = true;
      msg = sampleErrorText(e); kind = "warn";
    }
    C.parsing = false;
  }
  if (!items) {
    items = ruleParse(raw);
    if (!msg) msg = items.length ? `${items.length}개를 찾았습니다. 경계가 맞는지 확인하세요.` : "";
  }
  if (!items.length) { msg = "리뷰를 찾지 못했습니다. 리뷰 사이에 빈 줄을 넣어 다시 붙여넣어 보세요."; kind = "bad"; }
  C.items = items;
  markDuplicates();
  C.msg = msg; C.msgKind = kind;
  renderCollect();
}

async function addToPool() {
  const product = Store.products.get(C.productId);
  if (!product) return;
  markDuplicates();
  const docs = C.items.filter((it) => !it._dup && textLen(it.text) >= 2).map((it) => ({
    id: uid("r"), productId: product.id, platform: product.platform, source: "수동 붙여넣기",
    star: it.star || null, date: it.date ? normDate(it.date) || "" : "", option: it.option || "", badges: it.badges || [],
    helpful: it.helpful ?? null, text: it.text.trim(), len: textLen(it.text), createdAt: nowISO(), label: null, rejudge: null,
  }));
  if (!docs.length) return;
  if (Store.reviews.size + Store.products.size + docs.length > DOC_CAP - 20) {
    C.msg = `저장 한도(${DOC_CAP}개)에 가까워 추가할 수 없습니다. 설정에서 백업을 받은 뒤 오래된 리뷰를 지우세요.`; C.msgKind = "bad";
    renderCollect(); return;
  }
  C.saving = true; renderCollect();
  try {
    await putMany("reviews", docs, (d, n) => { const el = $("#saveProg"); if (el) el.textContent = `저장 중 ${d}/${n}`; });
    C.items = []; C.raw = ""; C.saving = false;
    const ta = $("#cRaw"); if (ta) ta.value = "";
    C.msg = `${docs.length}개를 판정 풀에 넣었습니다.`; C.msgKind = "good";
  } catch (e) {
    C.saving = false;
    C.msg = dbErrorText(e); C.msgKind = "bad";
  }
  renderCollect();
}

$("#view-collect").addEventListener("click", async (e) => {
  const b = e.target.closest("[data-c]");
  if (!b) return;
  const act = b.dataset.c;
  const i = b.dataset.i != null ? +b.dataset.i : -1;
  if (act === "toggleNew") { C.showNew = !C.showNew; renderCollect(); }
  else if (act === "select") { C.productId = b.dataset.id; markDuplicates(); renderCollect(); }
  else if (act === "delAsk") { C.delId = b.dataset.id; renderCollect(); }
  else if (act === "delNo") { C.delId = null; renderCollect(); }
  else if (act === "delYes") {
    const id = b.dataset.id;
    C.delId = null;
    try {
      const mine = allReviews().filter((r) => r.productId === id);
      for (const r of mine) await removeDoc("reviews", r.id);
      await removeDoc("products", id);
      toast("상품과 리뷰를 지웠습니다");
    } catch (err) { toast(dbErrorText(err), 5000); }
  }
  else if (act === "parse") doParse();
  else if (act === "stop") { C.ctl && C.ctl.abort(); }

  else if (act === "badge" && C.items[i]) {

/* ---------- 현황 화면 ---------- */
function kappa(pairs) {
  const n = pairs.length;
  if (!n) return null;
  const ca = {}, cb = {};
  let po = 0;
  for (const [a, b] of pairs) { if (a === b) po++; ca[a] = (ca[a] || 0) + 1; cb[b] = (cb[b] || 0) + 1; }
  po /= n;
  let pe = 0;
  for (const c of new Set([...Object.keys(ca), ...Object.keys(cb)])) pe += ((ca[c] || 0) / n) * ((cb[c] || 0) / n);
  if (pe >= 1) return po === 1 ? 1 : 0;
  return (po - pe) / (1 - pe);
}
function kappaWord(k) {
  if (k == null) return "";
  if (k < 0.2) return "낮음";
  if (k < 0.4) return "다소 낮음";
  if (k < 0.6) return "보통";
  if (k < 0.8) return "높음";
  return "매우 높음";
}
const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

function stackBar(counts, total) {
  if (!total) return `<div class="stack-bar"></div>`;
  return `<div class="stack-bar" role="img" aria-label="${TAGS.map((t) => `${t} ${counts[t] || 0}개`).join(", ")}">${TAGS.map((t) =>
    counts[t] ? `<i style="width:${(counts[t] / total) * 100}%;background:${TAG_COLOR[t]}"></i>` : "").join("")}</div>`;
}

function buildCSV() {

    "수집 방식", "수집 일시", "실사용 증거(0-3)", "홍보·의심(0-2)", "확신도(1-5)", "이유 칩", "메모", "파생 태그", "판정 일시", "평가용 분리",
    "재판정 실사용 증거", "재판정 홍보·의심", "재판정 태그", "재판정 일시"];
  const rows = allReviews().sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt))).map((r) => {

    const l = r.label || {};

    return [r.id, p.name, p.platform || r.platform, p.category, p.url, r.star, r.date, r.option, (r.badges || []).join("|"), r.helpful,
      r.len ?? textLen(r.text), r.text, r.source, r.createdAt, l.evidence, l.promo, l.confidence, (l.chips || []).join("|"), l.note, l.tag, l.at, l.split,

  return "﻿" + [head, ...rows].map((row) => row.map(csvCell).join(",")).join("\r\n");
}

async function saveFile(filename, data, mime) {
  if (Caps.downloads) {
    try { await Caps.downloads.save({ filename, data }); toast("파일을 저장했습니다"); return; }
    catch (e) {
      if (e && e.code === "declined") return;
      if (e && e.code === "rate_limited") { toast("잠시 뒤 다시 눌러 주세요"); return; }
    }
  }
  if (window.claude) { toast("이 화면에서는 파일 저장을 쓸 수 없습니다.", 4000); return; }
  const url = URL.createObjectURL(new Blob([data], { type: mime }));
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}

$("#view-settings").addEventListener("change", (e) => {
  if (e.target.id !== "sImport" || !e.target.files || !e.target.files[0]) return;
  const file = e.target.files[0];
  const fr = new FileReader();
  fr.onload = async () => {
    try {
      const o = JSON.parse(String(fr.result));
      const prods = (Array.isArray(o.products) ? o.products : []).filter((p) => p && p.id && p.name && !Store.products.has(p.id));
      const revs = (Array.isArray(o.reviews) ? o.reviews : []).filter((r) => r && r.id && r.productId && typeof r.text === "string" && !Store.reviews.has(r.id));
      if (Store.reviews.size + Store.products.size + prods.length + revs.length > DOC_CAP - 20) throw new Error("cap");
      S.importMsg = `가져오는 중 0/${prods.length + revs.length}`; S.importKind = ""; renderSettings();
      await putMany("products", prods);
      await putMany("reviews", revs);
      S.importMsg = `상품 ${prods.length}개, 리뷰 ${revs.length}개를 가져왔습니다.`; S.importKind = "good";
    } catch (err) {
      S.importMsg = err && err.message === "cap" ? `저장 한도(${DOC_CAP}개)를 넘어 가져올 수 없습니다.` : err && err.code ? dbErrorText(err) : "백업 파일을 읽지 못했습니다. 이 앱에서 받은 JSON 파일인지 확인하세요.";
      S.importKind = "bad";
    }
    renderSettings();
  };
  fr.readAsText(file);
});

/* ---------- 화면 전환과 시작 ---------- */
const VIEWS = ["judge", "collect", "stats", "settings"];
const RENDER = { judge: renderJudge, collect: renderCollect, stats: renderStats, settings: renderSettings };
let currentView = "judge";
let pendingRender = false;

function updateChrome() {
  const pill = $("#storePill");
  const m = Store.mode;
  pill.className = "store-pill " + (m === "db" ? "ok" : m === "loading" ? "" : "local");
  pill.textContent = m === "db" ? "기기 간 동기화" : m === "local" ? "이 기기에만 저장" : m === "memory" ? "저장 안 됨" : "불러오는 중";
  const labeled = allReviews().filter((r) => r.label).length;
  $("#navPool").textContent = `대기 ${poolCount()}`;
  $("#navDone").textContent = `${labeled}개`;
}
function renderAll() {
  updateChrome();
  const el = $("#view-" + currentView);
  const ae = document.activeElement;
  if (ae && el.contains(ae) && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName)) { pendingRender = true; return; }
  pendingRender = false;
  RENDER[currentView]();
}
document.addEventListener("focusout", () => {
  if (!pendingRender) return;
  setTimeout(() => {
    const ae = document.activeElement;
    if (!(ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))) renderAll();
  }, 0);
});
function setView(name) {
  if (!VIEWS.includes(name)) name = "judge";
  currentView = name;
  for (const n of VIEWS) {
    $("#view-" + n).hidden = n !== name;
    $("#tab-" + n).setAttribute("aria-selected", String(n === name));
  }
  try { localStorage.setItem(LS_KEY + "-tab", name); } catch {}
  pendingRender = false;
  RENDER[name]();
  updateChrome();
  window.scrollTo(0, 0);
}
document.addEventListener("click", (e) => {
  const t = e.target.closest("[data-view],[data-go]");
  if (t) setView(t.dataset.view || t.dataset.go);
});

Store.onChange(renderAll);
let startView = "judge";
const hash = location.hash.replace("#", "");
if (VIEWS.includes(hash)) startView = hash;
else { try { const saved = localStorage.getItem(LS_KEY + "-tab"); if (VIEWS.includes(saved)) startView = saved; } catch {} }
setView(startView);

capability("db").then((db) => { if (db) initDb(db); else initLocal(); renderAll(); });
capability("sample").then((x) => { Caps.sample = x; if (currentView === "collect") renderAll(); });
capability("downloads").then((x) => { Caps.downloads = x; });
})();
</script>
